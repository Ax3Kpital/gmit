services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gmit_backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://gmit:gmit@postgres:5432/gmit}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production-32chars}
      - LLM_PROVIDER=${LLM_PROVIDER:-rules}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - EIA_API_KEY=${EIA_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CORS_ORIGINS=["http://localhost:3001"]
      - APP_ENV=${APP_ENV:-development}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gmit_network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: gmit_web
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - API_URL=http://backend:8000
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - gmit_network

  postgres:
    image: postgres:16-alpine
    container_name: gmit_postgres
    environment:
      - POSTGRES_DB=gmit
      - POSTGRES_USER=gmit
      - POSTGRES_PASSWORD=gmit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmit -d gmit"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - gmit_network

volumes:
  postgres_data:
  web_node_modules:
  web_next:

networks:
  gmit_network:
    driver: bridge
